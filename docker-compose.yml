services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: club-directory:latest
    restart: unless-stopped
    environment:
      CD_BASE_URL: "${BASE_URL:?set BASE_URL in .env, e.g. http://clubdir.local.mesh}"
      CD_TRUSTED_PROXIES: "${TRUSTED_PROXIES:-172.28.1.20/32}"
      CD_BOOTSTRAP_ADMIN: "${BOOTSTRAP_ADMIN:-}"
      CD_SECURE_COOKIES: "${SECURE_COOKIES:-}"
      CD_ECHO_MAIL: "${ECHO_MAIL:-}"
      CD_SMTP_HOST: "${SMTP_HOST:-}"
      CD_SMTP_PORT: "${SMTP_PORT:-25}"
      CD_SMTP_USER: "${SMTP_USER:-}"
      CD_SMTP_PASS: "${SMTP_PASS:-}"
      CD_SMTP_FROM: "${SMTP_FROM:-club-directory@localhost}"
      CD_SMTP_STARTTLS: "${SMTP_STARTTLS:-}"
      CD_SMTP_INSECURE: "${SMTP_INSECURE:-}"
    volumes:
      - clubdir-data:/data
    networks:
      internal:
        ipv4_address: 172.28.1.10
    # Not published to the host — only nginx is reachable from outside this
    # compose network, so trusting its X-Forwarded-For is safe.
    expose:
      - "8080"

  nginx:
    build:
      context: ./nginx
    image: club-directory-nginx:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SERVER_NAME: "${SERVER_NAME:?set SERVER_NAME in .env, e.g. clubdir.local.mesh}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Drop a manually provisioned fullchain.pem + privkey.pem here to turn
      # on :443. Leave it empty for a local.mesh name with no cert available
      # — nginx serves plain :80 either way, never redirects to :443.
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      internal:
        ipv4_address: 172.28.1.20

  # NetRemind scheduler: one-shot reminder runs on a cron schedule inside
  # the container, sharing the same SQLite database (read + outbox writes)
  # as the app. Busy timeout + single connection keep concurrent access
  # safe; reminders only email opted-in subscribers.
  netremind:
    build:
      context: .
      dockerfile: Dockerfile
    image: club-directory:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # CD_REMIND_ONLY makes the binary send today's reminders and exit;
    # cron re-invokes it each morning at CRON_REMIND_TIME (container local
    # time — set TZ to match your club).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "netremind scheduler starting; reminders at ${CRON_REMIND_TIME:-07:00} (${TZ:-UTC})"
        while true; do
          # seconds until the next CRON_REMIND_TIME
          now=$$(date +%s)
          target=$$(date -d "today ${CRON_REMIND_TIME:-07:00}" +%s)
          if [ "$$target" -le "$$now" ]; then target=$$(date -d "tomorrow ${CRON_REMIND_TIME:-07:00}" +%s); fi
          sleep $$((target - now))
          echo "running net reminders at $$(date)"
          CD_REMIND_ONLY=1 /usr/local/bin/clubdir || echo "reminder run failed; will retry tomorrow"
          # sleep past the minute so a fast exit cannot double-fire
          sleep 60
        done
    environment:
      CD_DATA: /data
      TZ: "${TZ:-UTC}"
      CD_SMTP_HOST: "${SMTP_HOST:-}"
      CD_SMTP_PORT: "${SMTP_PORT:-25}"
      CD_SMTP_USER: "${SMTP_USER:-}"
      CD_SMTP_PASS: "${SMTP_PASS:-}"
      CD_SMTP_FROM: "${SMTP_FROM:-club-directory@localhost}"
      CD_SMTP_STARTTLS: "${SMTP_STARTTLS:-}"
      CD_SMTP_INSECURE: "${SMTP_INSECURE:-}"
    volumes:
      - clubdir-data:/data
    networks:
      internal:
        ipv4_address: 172.28.1.30

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24

volumes:
  clubdir-data:
